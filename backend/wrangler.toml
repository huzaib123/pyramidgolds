name = "pyramidgolds-chat"
main = "src/worker.js"
compatibility_date = "2026-09-01"

# Create with: npx wrangler kv namespace create STATE  (then paste the id below)
[[kv_namespaces]]
binding = "STATE"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

# Owner pings: strongly consistent store shared by the webhook and the customer's poll.
[[durable_objects.bindings]]
name = "PINGS"
class_name = "Pings"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Pings"]

# Keeps Worker logs in the Cloudflare dashboard (Workers & Pages -> pyramidgolds-chat -> Logs).
[observability]
enabled = true

[vars]
OPENAI_MODEL = "gpt-4o-mini"
ALLOWED_ORIGINS = "https://pyramidgolds.in,https://www.pyramidgolds.in"
WA_OWNER_NUMBER = "60148927013"
# Meta's sample template until owner_floor_check is approved; then switch to owner_floor_check / en.
WA_TEMPLATE = "hello_world"
WA_TEMPLATE_LANG = "en_US"
# Store hours in India time (24h). The owner is only pinged inside these hours.
OPEN_HOUR = "10"
CLOSE_HOUR = "21"
PING_TIMEOUT_SEC = "180"

# Secrets (set with `npx wrangler secret put NAME`, never commit them):
#   OPENAI_API_KEY, WA_TOKEN, WA_PHONE_NUMBER_ID, WA_VERIFY_TOKEN, WA_APP_SECRET,
#   SHEET_WEBHOOK_URL, SHEET_WEBHOOK_SECRET
